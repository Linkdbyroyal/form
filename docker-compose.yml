services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sbos-postgres
    environment:
      POSTGRES_USER: sbos
      POSTGRES_PASSWORD: sbos
      POSTGRES_DB: sbos_dev
    ports:
      - "5432:5432"
    volumes:
      - sbos_pgdata:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbos -d sbos_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sbos_pgdata:
