<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Linkd by Royal — Medical Tourism Venture Discovery Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light only;
    --navy:#0f1b2d; --navy-2:#16273d; --navy-3:#1d3350;
    --gold:#c6a15b; --gold-soft:#e3cd9a;
    --cream:#f8f6f0; --ink:#1c2430; --slate:#6b7480; --line:#e4ddce;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Playfair Display',serif;}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;}

  header.app-header{background:var(--navy);color:#fff;padding:20px 24px 24px;position:sticky;top:0;z-index:50;}
  .brandrow{display:flex;align-items:center;justify-content:space-between;max-width:960px;margin:0 auto 16px;gap:12px;}
  .brandrow .brand{font-family:'Playfair Display',serif;font-size:19px;}
  .brandrow .brand span{color:var(--gold-soft);}
  .langswitch{display:flex;border:1px solid rgba(255,255,255,.25);border-radius:18px;overflow:hidden;}
  .langswitch button{border:none;background:transparent;color:#9aa7b8;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;padding:6px 14px;cursor:pointer;}
  .langswitch button.on{background:var(--gold);color:var(--navy);}
  .route-wrap{max-width:960px;margin:0 auto;position:relative;}
  .route-track{position:relative;height:42px;}
  .route-line{position:absolute;left:12px;right:12px;top:19px;height:2px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;}
  .route-line-fill{height:100%;background:linear-gradient(90deg,var(--gold-soft),var(--gold));width:0%;transition:width .5s ease;}
  .route-dots{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;}
  .route-dot{width:44px;display:flex;flex-direction:column;align-items:center;font-size:8.5px;letter-spacing:.03em;color:#7d8a9c;text-align:center;cursor:pointer;}
  .route-dot .pip{width:9px;height:9px;border-radius:50%;background:var(--navy-2);border:2px solid rgba(255,255,255,.25);margin-bottom:5px;transition:all .3s;}
  .route-dot.done .pip{background:var(--gold);border-color:var(--gold);}
  .route-dot.current .pip{background:var(--navy);border-color:var(--gold);box-shadow:0 0 0 4px rgba(198,161,91,.25);}
  .route-dot.current{color:var(--gold-soft);font-weight:600;}
  .route-boat{position:absolute;top:11px;transform:translateX(-50%);transition:left .5s ease;font-size:13px;}
  .progress-row{max-width:960px;margin:8px auto 0;font-size:11px;color:#8b98a9;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center;}
  .progress-row button{background:none;border:none;color:#8b98a9;font-family:'Inter',sans-serif;font-size:11px;cursor:pointer;text-decoration:underline;padding:0;}
  .progress-row button:hover{color:var(--gold-soft);}

  main{max-width:740px;margin:0 auto;padding:44px 24px 160px;}
  .panel{display:none;animation:fade .4s ease;}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .panel h2{font-size:27px;font-weight:600;margin:6px 0;color:var(--navy);}
  .panel .intro-text{color:var(--slate);font-size:15px;line-height:1.65;margin-bottom:30px;}

  .field-group{margin-bottom:26px;}
  .field-label{display:block;font-size:15.5px;font-weight:600;color:#fff !important;background:var(--navy);padding:10px 14px;border-radius:9px;margin-bottom:12px;line-height:1.45;}
  .field-hint{font-size:12px;color:var(--slate);margin-top:6px;}
  input[type=text],input[type=url],input[type=date],input[type=email],textarea,select{
    width:100%;font-family:'Inter',sans-serif;font-size:15px;padding:13px 15px;
    border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);transition:border-color .2s;
  }
  textarea{min-height:88px;resize:vertical;}
  input,textarea,select{background-color:#fff !important;color:var(--ink) !important;}
  select option{background:#fff;color:var(--ink);}
  ::placeholder{color:#9aa3ae;opacity:1;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(198,161,91,.15);}

  .choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:10px;}
  .choice{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;font-size:14.5px;display:flex;align-items:center;gap:9px;cursor:pointer;transition:all .15s;user-select:none;color:var(--ink);}
  .choice:hover{border-color:var(--gold-soft);}
  .choice input{accent-color:var(--gold);width:15px;height:15px;flex-shrink:0;}
  .choice.checked{border-color:var(--gold);background:linear-gradient(0deg,#fff,#fdf9f0);box-shadow:0 0 0 1px var(--gold) inset;}

  .yn-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);gap:12px;}
  .yn-label{font-size:14.5px;font-weight:600;color:#fff !important;background:var(--navy);padding:8px 13px;border-radius:9px;}
  .switch{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;flex-shrink:0;}
  .switch button{border:none;background:#fff;padding:6px 15px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--slate);font-family:'Inter',sans-serif;}
  .switch button.on{background:var(--navy);color:#fff;}
  .switch button.on.yes{background:var(--gold);color:var(--navy);}

  .followup{margin-top:12px;padding:14px 16px;background:#fdf9f0;border:1px dashed var(--gold-soft);border-radius:10px;display:none;}
  .followup.show{display:block;}

  .rating-scale{display:flex;gap:4px;flex-wrap:wrap;}
  .rating-scale button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--ink);cursor:pointer;}
  .rating-scale button.on{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700;}

  .matrix-row{padding:14px 0;border-bottom:1px solid var(--line);}
  .matrix-row .obj{font-size:14.5px;font-weight:600;color:#fff !important;background:var(--navy);padding:8px 13px;border-radius:9px;display:inline-block;margin-bottom:10px;}
  .matrix-scales{display:flex;gap:26px;flex-wrap:wrap;}
  .matrix-scales .dim{display:flex;align-items:center;gap:10px;}
  .matrix-scales .dim-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);width:78px;font-weight:600;}

  .navbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:13px 24px;z-index:40;}
  .navbar .inner{max-width:740px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;}
  .btn{font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;padding:12px 22px;border-radius:9px;border:1px solid transparent;cursor:pointer;transition:opacity .15s;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{opacity:.9;}
  .btn-gold{background:var(--gold);color:var(--navy);}
  .btn-ghost{background:transparent;color:var(--slate);border-color:var(--line);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .savestate{font-size:11px;color:var(--slate);}

  .cover{text-align:center;padding:44px 10px 20px;}
  .cover h1{font-size:34px;line-height:1.18;color:var(--navy);margin:18px 0 14px;}
  .cover p{color:var(--slate);font-size:15px;max-width:520px;margin:0 auto 24px;line-height:1.7;}
  .cover .meta{display:flex;gap:26px;justify-content:center;margin-top:26px;font-size:12px;color:var(--slate);flex-wrap:wrap;}
  .cover .meta b{display:block;color:var(--navy);font-size:15px;font-family:'Playfair Display',serif;}
  .cover .note{font-size:12px;color:var(--slate);margin-top:22px;}
  .privacy-note{max-width:560px;margin:26px auto 0;background:#fff;border:1px solid var(--gold-soft);border-radius:12px;padding:16px 18px;font-size:13px;color:var(--ink);line-height:1.7;text-align:left;}
  .privacy-note b{color:var(--navy);}

  .finish{background:linear-gradient(135deg,var(--navy),var(--navy-3));border-radius:14px;padding:38px 28px;text-align:center;color:#fff;}
  .finish h2{color:#fff;font-size:24px;margin:12px 0;}
  .finish p{color:#b7c0cd;font-size:14px;max-width:480px;margin:0 auto 22px;line-height:1.75;}
  .finish .btn-gold{font-size:14px;font-weight:700;padding:14px 30px;border:none;}
  .finish .btn-gold:disabled{opacity:.6;cursor:wait;}
  .loading-dots span{animation:blink 1.2s infinite;}
  .loading-dots span:nth-child(2){animation-delay:.2s;}
  .loading-dots span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}
  .thanks{text-align:center;padding:60px 12px;}
  .thanks .mark{font-size:46px;color:var(--gold);}
  .thanks h1{font-size:32px;color:var(--navy);margin:16px 0 12px;}
  .thanks p{color:var(--slate);font-size:15.5px;max-width:520px;margin:0 auto;line-height:1.8;}

  @media(max-width:680px){
    .route-dot{width:auto;font-size:0;}
    .route-dot .pip{margin-bottom:0;}
    .cover h1{font-size:26px;}
    .matrix-scales{gap:10px;flex-direction:column;align-items:flex-start;}
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="brandrow">
    <div class="brand">Linkd <span>by Royal</span></div>
    <div class="langswitch" id="langSwitch">
      <button data-lang="nl">NL</button><button data-lang="en">EN</button>
    </div>
  </div>
  <div class="route-wrap">
    <div class="route-track">
      <div class="route-line"><div class="route-line-fill" id="routeFill"></div></div>
      <div class="route-boat" id="routeBoat">⛴</div>
      <div class="route-dots" id="routeDots"></div>
    </div>
  </div>
  <div class="progress-row">
    <button id="resetBtn" type="button"></button>
    <span id="progressPct"></span>
  </div>
</header>

<main id="main"></main>

<div class="navbar" id="navbar">
  <div class="inner">
    <button class="btn btn-ghost" id="prevBtn"></button>
    <span class="savestate" id="saveState"></span>
    <button class="btn btn-primary" id="nextBtn"></button>
  </div>
</div>

function fieldHtml(f){
  const label=`<label class="field-label">${t(f.l)}</label>`;
  const ph=f.ph?` placeholder="${t(f.ph)}"`:'';
  if(f.t==='tx') return `<div class="field-group">${label}<input type="${f.type||'text'}" data-key="${f.k}"${ph}></div>`;
  if(f.t==='ta') return `<div class="field-group">${label}<textarea data-key="${f.k}"${ph}></textarea></div>`;
  if(f.t==='sel') return `<div class="field-group">${label}<select data-key="${f.k}"><option value="">${t(UI.choose)}</option>${f.opts.map(o=>`<option value="${o.v}">${t(o)}</option>`).join('')}</select></div>`;
  if(f.t==='cg') return `<div class="field-group">${label}
      <div class="choice-grid" data-checkgroup="${f.k}">${f.opts.map(o=>`<label class="choice"><input type="checkbox" value="${o.v}">${t(o)}</label>`).join('')}</div>
      ${f.other?`<input style="margin-top:12px" type="text" placeholder="${t(f.other)}" data-key="${f.k}_anders">`:''}</div>`;
  if(f.t==='yn'){
    let h=`<div class="yn-row" data-ynrow="${f.k}"><span class="yn-label">${t(f.l)}</span>
      <div class="switch"><button type="button" data-val="nee">${lang==='nl'?'Nee':'No'}</button><button type="button" data-val="ja">${lang==='nl'?'Ja':'Yes'}</button></div></div>`;
    if(f.fu) h+=`<div class="followup" data-followup-for="${f.k}">${fieldHtml(f.fu)}</div>`;
    return h;
  }
  if(f.t==='scale') return `<div class="field-group">${label}<div class="rating-scale" data-rating="${f.k}" data-max="${f.max}"></div></div>`;
  if(f.t==='fuc') return `<div class="followup" data-followup-for-check="${f.forKey}:${f.forVal}">${fieldHtml(f.f)}</div>`;
  if(f.t==='matrix') return `<div id="priorityMatrix"></div>`;
  return '';
}

function buildPage(){
  const main=document.getElementById('main');
  let html=`
  <section class="panel" data-panel="0">
    <div class="cover">
      <div class="eyebrow">${t(COVER.eyebrow)}</div>
      <h1>${t(COVER.h1)}</h1>
      <p>${t(COVER.p)}</p>
      <div class="meta"><div><b>9</b>${t(COVER.m1)}</div><div><b>12-15</b>${t(COVER.m2)}</div></div>
      <div class="privacy-note">${t(COVER.privacy)}</div>
      <p class="note">${t(COVER.note)}</p>
    </div>
  </section>`;
  DEF.forEach((s,i)=>{
    const n=i+1;
    html+=`<section class="panel" data-panel="${n}">
      <div class="eyebrow">${t(UI.sectionWord)} ${n} / ${SECTION_COUNT}</div>
      <h2>${t(s.title)}</h2>
      ${t(s.intro)?`<p class="intro-text">${t(s.intro)}</p>`:''}
      ${s.fields.map(fieldHtml).join('')}
    </section>`;
  });
  html+=`
  <section class="panel" data-panel="${SECTION_COUNT+1}">
    <div id="finishBlock" class="finish">
      <div class="eyebrow" style="color:var(--gold-soft);">${t(FINISH.eyebrow)}</div>
      <h2>${t(FINISH.h2)}</h2>
      <p>${t(FINISH.p)}</p>
      <button id="submitBtn" type="button" class="btn-gold btn">${t(UI.submit)}</button>
      <p id="submitError" style="display:none;color:#f0c9c9;margin-top:16px;font-size:13px;"></p>
    </div>
    <div id="thanksBlock" class="thanks" style="display:none;">
      <div class="mark">✦</div>
      <h1>${t(THANKS.h1)}</h1>
      <p>${t(THANKS.p)}</p>
    </div>
  </section>`;
  main.innerHTML=html;

  const dots=document.getElementById('routeDots');
  dots.innerHTML='';
  ROUTE_LABELS.forEach((lbl,i)=>{
    if(i===0||i===ROUTE_LABELS.length-1) return;
    const d=document.createElement('div');
    d.className='route-dot'; d.dataset.i=i;
    d.innerHTML=`<div class="pip"></div><div>${t(lbl)}</div>`;
    d.addEventListener('click',()=>{ if(!submitted) showPanel(i); });
    dots.appendChild(d);
  });

  document.getElementById('prevBtn').textContent=t(UI.prev);
  document.getElementById('nextBtn').textContent=t(UI.next);
  document.getElementById('resetBtn').textContent=t(UI.reset);

  attachBindings();
  restoreAnswers();
}

function persist(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify({current,answers,submitted}));
    const el=document.getElementById('saveState');
    el.textContent=t(UI.saved);
    clearTimeout(persist._t); persist._t=setTimeout(()=>{el.textContent='';},1500);
  }catch(e){}
}

function attachBindings(){
  document.querySelectorAll('[data-key]').forEach(el=>{
    el.addEventListener('input',()=>{ answers[el.dataset.key]=el.value; persist(); });
  });
  document.querySelectorAll('[data-checkgroup]').forEach(group=>{
    const key=group.dataset.checkgroup;
    if(!answers[key]) answers[key]=[];
    group.querySelectorAll('input[type=checkbox]').forEach(cb=>{
      cb.addEventListener('change',()=>{
        cb.closest('.choice').classList.toggle('checked',cb.checked);
        answers[key]=Array.from(group.querySelectorAll('input:checked')).map(c=>c.value);
        syncCheckFollowups(key); persist();
      });
    });
  });
  document.querySelectorAll('[data-ynrow]').forEach(row=>{
    const key=row.dataset.ynrow;
    row.querySelectorAll('.switch button').forEach(btn=>{
      btn.addEventListener('click',()=>{ setYN(key,btn.dataset.val); persist(); });
    });
  });
  document.querySelectorAll('[data-rating]').forEach(c=>buildScale(c,c.dataset.rating,parseInt(c.dataset.max||'10')));

  const matrixEl=document.getElementById('priorityMatrix');
  if(matrixEl){
    matrixEl.innerHTML='';
    PRIORITY_ITEMS.forEach(([key,lbl])=>{
      const row=document.createElement('div');
      row.className='matrix-row';
      row.innerHTML=`<div class="obj">${t(lbl)}</div>
        <div class="matrix-scales">
          <div class="dim"><span class="dim-label">${t(UI.impact)}</span><div class="rating-scale" id="${key}_impact_scale"></div></div>
          <div class="dim"><span class="dim-label">${t(UI.effort)}</span><div class="rating-scale" id="${key}_effort_scale"></div></div>
        </div>`;
      matrixEl.appendChild(row);
      buildScale(document.getElementById(key+'_impact_scale'),key+'_impact',5);
      buildScale(document.getElementById(key+'_effort_scale'),key+'_effort',5);
    });
  }
  const sb=document.getElementById('submitBtn');
  if(sb) sb.addEventListener('click',submitIntake);
}

function syncCheckFollowups(key){
  document.querySelectorAll(`[data-followup-for-check^="${key}:"]`).forEach(fu=>{
    const wanted=fu.dataset.followupForCheck.split(':')[1];
    fu.classList.toggle('show',(answers[key]||[]).includes(wanted));
  });
}
function setYN(key,val){
  const row=document.querySelector(`[data-ynrow="${key}"]`);
  if(!row) return;
  answers[key]=val;
  row.querySelectorAll('.switch button').forEach(b=>{
    b.classList.toggle('on',b.dataset.val===val);
    b.classList.toggle('yes',b.dataset.val===val&&val==='ja');
  });
  const fu=document.querySelector(`[data-followup-for="${key}"]`);
  if(fu) fu.classList.toggle('show',val==='ja');
}
function buildScale(container,key,max){
  container.innerHTML='';
  for(let n=1;n<=max;n++){
    const b=document.createElement('button');
    b.type='button'; b.textContent=n;
    b.addEventListener('click',()=>{ setScale(container,key,n); persist(); });
    container.appendChild(b);
  }
}
function setScale(container,key,n){
  answers[key]=n;
  Array.from(container.querySelectorAll('button')).forEach((b,i)=>b.classList.toggle('on',i+1===n));
}

function restoreAnswers(){
  Object.entries(answers).forEach(([key,val])=>{
    const el=document.querySelector(`[data-key="${key}"]`);
    if(el&&typeof val==='string'){ el.value=val; return; }
    const group=document.querySelector(`[data-checkgroup="${key}"]`);
    if(group&&Array.isArray(val)){
      group.querySelectorAll('input[type=checkbox]').forEach(cb=>{
        cb.checked=val.includes(cb.value);
        cb.closest('.choice').classList.toggle('checked',cb.checked);
      });
      syncCheckFollowups(key); return;
    }
    if(document.querySelector(`[data-ynrow="${key}"]`)){ setYN(key,val); return; }
    if(typeof val==='number'){
      const c=document.querySelector(`[data-rating="${key}"]`)||document.getElementById(key.replace(/_(impact|effort)$/,'_$1_scale'));
      if(c) setScale(c,key,val);
    }
  });
}

/* =================== NAVIGATION =================== */
function updateRoute(){
  const last=SECTION_COUNT+1;
  const clamped=Math.max(1,Math.min(current,SECTION_COUNT));
  document.querySelectorAll('.route-dot').forEach(d=>{
    const di=parseInt(d.dataset.i);
    d.classList.toggle('done',di<clamped||current===last);
    d.classList.toggle('current',di===clamped&&current>0&&current<last);
  });
  let pct=current===0?0:current>=last?100:Math.round((clamped/SECTION_COUNT)*100);
  document.getElementById('routeFill').style.width=pct+'%';
  document.getElementById('progressPct').textContent=pct+t(UI.progress);
  document.getElementById('routeBoat').style.left=`calc(12px + ${pct} * (100% - 24px) / 100)`;
}
function showPanel(i){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  const p=document.querySelector(`.panel[data-panel="${i}"]`);
  if(!p) return;
  p.classList.add('active');
  current=i; persist(); updateRoute();
  const last=SECTION_COUNT+1;
  document.getElementById('prevBtn').disabled=(i===0||submitted);
  document.getElementById('nextBtn').style.display=(i===last)?'none':'inline-block';
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('nextBtn').addEventListener('click',()=>{ if(current<SECTION_COUNT+1) showPanel(current+1); });
document.getElementById('prevBtn').addEventListener('click',()=>{ if(current>0) showPanel(current-1); });
document.getElementById('resetBtn').addEventListener('click',()=>{
  if(confirm(t(UI.resetConfirm))){ localStorage.removeItem(STORAGE_KEY); location.reload(); }
});

/* =================== LANGUAGE SWITCH =================== */
function setLang(l){
  lang=l;
  localStorage.setItem('lbr_lang',l);
  document.documentElement.lang=l;
  document.querySelectorAll('#langSwitch button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
  buildPage();
  showPanel(submitted?SECTION_COUNT+1:current);
  if(submitted) showThanks();
}
document.querySelectorAll('#langSwitch button').forEach(b=>{
  b.addEventListener('click',()=>setLang(b.dataset.lang));
});

/* =================== SUBMIT =================== */
function showThanks(){
  const f=document.getElementById('finishBlock'), th=document.getElementById('thanksBlock');
  if(f) f.style.display='none';
  if(th) th.style.display='block';
  document.getElementById('navbar').style.display='none';
  updateRoute();
}
async function submitIntake(){
  const btn=document.getElementById('submitBtn');
  const errEl=document.getElementById('submitError');
  btn.disabled=true;
  btn.innerHTML=`${t(UI.submitting)}<span class="loading-dots">.<span>.</span><span>.</span></span>`;
  errEl.style.display='none';
  try{
    const r=await fetch('/api/submit',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({answers,lang})
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    submitted=true; current=SECTION_COUNT+1; persist();
    showThanks();
  }catch(e){
    console.error('Submit mislukt:',e);
    btn.disabled=false;
    btn.textContent=t(UI.retry);
    errEl.textContent=t(UI.submitFail);
    errEl.style.display='block';
  }
}

/* =================== INIT =================== */
(function init(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(saved){ answers=saved.answers||{}; current=saved.current||0; submitted=!!saved.submitted; }
  }catch(e){}
  document.querySelectorAll('#langSwitch button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  buildPage();
  showPanel(submitted?SECTION_COUNT+1:Math.min(current,SECTION_COUNT+1));
  if(submitted) showThanks();
})();
</script>
