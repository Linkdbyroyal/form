<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Linkd by Royal — Discovery & Strategy Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light only;
    --navy:#0f1b2d; --navy-2:#16273d; --navy-3:#1d3350;
    --gold:#c6a15b; --gold-soft:#e3cd9a;
    --cream:#f8f6f0; --ink:#1c2430; --slate:#6b7480; --line:#e4ddce;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Playfair Display',serif;}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;}

  header.app-header{background:var(--navy);color:#fff;padding:20px 24px 24px;position:sticky;top:0;z-index:50;}
  .brandrow{display:flex;align-items:baseline;justify-content:space-between;max-width:960px;margin:0 auto 16px;}
  .brandrow .brand{font-family:'Playfair Display',serif;font-size:19px;}
  .brandrow .brand span{color:var(--gold-soft);}
  .brandrow .sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9aa7b8;}
  .route-wrap{max-width:960px;margin:0 auto;position:relative;}
  .route-track{position:relative;height:42px;}
  .route-line{position:absolute;left:12px;right:12px;top:19px;height:2px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;}
  .route-line-fill{height:100%;background:linear-gradient(90deg,var(--gold-soft),var(--gold));width:0%;transition:width .5s ease;}
  .route-dots{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;}
  .route-dot{width:34px;display:flex;flex-direction:column;align-items:center;font-size:8.5px;letter-spacing:.03em;color:#7d8a9c;text-align:center;cursor:pointer;}
  .route-dot .pip{width:9px;height:9px;border-radius:50%;background:var(--navy-2);border:2px solid rgba(255,255,255,.25);margin-bottom:5px;transition:all .3s;}
  .route-dot.done .pip{background:var(--gold);border-color:var(--gold);}
  .route-dot.current .pip{background:var(--navy);border-color:var(--gold);box-shadow:0 0 0 4px rgba(198,161,91,.25);}
  .route-dot.current{color:var(--gold-soft);font-weight:600;}
  .route-boat{position:absolute;top:11px;transform:translateX(-50%);transition:left .5s ease;font-size:13px;}
  .progress-row{max-width:960px;margin:8px auto 0;font-size:11px;color:#8b98a9;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center;}
  .progress-row button{background:none;border:none;color:#8b98a9;font-family:'Inter',sans-serif;font-size:11px;cursor:pointer;text-decoration:underline;padding:0;}
  .progress-row button:hover{color:var(--gold-soft);}

  main{max-width:740px;margin:0 auto;padding:44px 24px 160px;}
  .panel{display:none;animation:fade .4s ease;}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .panel h2{font-size:27px;font-weight:600;margin:6px 0;color:var(--navy);}
  .panel .intro-text{color:var(--slate);font-size:15px;line-height:1.65;margin-bottom:30px;}

  .field-group{margin-bottom:26px;}
  .field-label{display:block;font-size:15.5px;font-weight:600;color:#fff !important;background:var(--navy);padding:10px 14px;border-radius:9px;margin-bottom:12px;line-height:1.45;}
  .field-hint{font-size:12px;color:var(--slate);margin-top:6px;}
  input[type=text],input[type=url],input[type=date],input[type=email],textarea,select{
    width:100%;font-family:'Inter',sans-serif;font-size:15px;padding:13px 15px;
    border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);transition:border-color .2s;
  }
  textarea{min-height:88px;resize:vertical;}
  input,textarea,select{background-color:#fff !important;color:var(--ink) !important;}
  select option{background:#fff;color:var(--ink);}
  ::placeholder{color:#9aa3ae;opacity:1;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(198,161,91,.15);}

  .choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:10px;}
  .choice{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;font-size:14.5px;display:flex;align-items:center;gap:9px;cursor:pointer;transition:all .15s;user-select:none;color:var(--ink);}
  .choice:hover{border-color:var(--gold-soft);}
  .choice input{accent-color:var(--gold);width:15px;height:15px;flex-shrink:0;}
  .choice.checked{border-color:var(--gold);background:linear-gradient(0deg,#fff,#fdf9f0);box-shadow:0 0 0 1px var(--gold) inset;}

  .yn-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);gap:12px;}
  .yn-label{font-size:14.5px;font-weight:600;color:#fff !important;background:var(--navy);padding:8px 13px;border-radius:9px;}
  .switch{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;flex-shrink:0;}
  .switch button{border:none;background:#fff;padding:6px 15px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--slate);font-family:'Inter',sans-serif;}
  .switch button.on{background:var(--navy);color:#fff;}
  .switch button.on.yes{background:var(--gold);color:var(--navy);}

  .followup{margin-top:12px;padding:14px 16px;background:#fdf9f0;border:1px dashed var(--gold-soft);border-radius:10px;display:none;}
  .followup.show{display:block;}

  .rating-scale{display:flex;gap:4px;flex-wrap:wrap;}
  .rating-scale button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--ink);cursor:pointer;}
  .rating-scale button.on{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700;}

  .matrix-row{padding:14px 0;border-bottom:1px solid var(--line);}
  .matrix-row .obj{font-size:14.5px;font-weight:600;color:#fff !important;background:var(--navy);padding:8px 13px;border-radius:9px;display:inline-block;margin-bottom:10px;}
  .matrix-scales{display:flex;gap:26px;flex-wrap:wrap;}
  .matrix-scales .dim{display:flex;align-items:center;gap:10px;}
  .matrix-scales .dim-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);width:78px;font-weight:600;}

  .upload-box{border:1.5px dashed var(--line);border-radius:10px;padding:20px;text-align:center;color:var(--slate);font-size:13px;background:#fff;}

  .navbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:13px 24px;z-index:40;}
  .navbar .inner{max-width:740px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;}
  .btn{font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;padding:12px 22px;border-radius:9px;border:1px solid transparent;cursor:pointer;transition:opacity .15s;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{opacity:.9;}
  .btn-ghost{background:transparent;color:var(--slate);border-color:var(--line);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .savestate{font-size:11px;color:var(--slate);}

  .cover{text-align:center;padding:52px 10px 20px;}
  .cover h1{font-size:36px;line-height:1.15;color:var(--navy);margin:18px 0 14px;}
  .cover p{color:var(--slate);font-size:15px;max-width:500px;margin:0 auto 28px;line-height:1.7;}
  .cover .meta{display:flex;gap:26px;justify-content:center;margin-top:30px;font-size:12px;color:var(--slate);}
  .cover .meta b{display:block;color:var(--navy);font-size:15px;font-family:'Playfair Display',serif;}
  .cover .note{font-size:12px;color:var(--slate);margin-top:26px;}

  .score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0 28px;}
  .score-card{background:var(--navy);color:#fff;border-radius:12px;padding:18px 14px;text-align:center;}
  .score-card .num{font-family:'Playfair Display',serif;font-size:30px;color:var(--gold-soft);}
  .score-card .num small{font-size:14px;color:#9aa7b8;}
  .score-card .lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#9aa7b8;margin-top:4px;}
  .score-card .bench{font-size:10.5px;color:#8b98a9;margin-top:8px;line-height:1.5;}
  .result-block{margin-bottom:26px;}
  .result-block h3{font-size:15px;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .result-block h3::before{content:'';width:16px;height:1.5px;background:var(--gold);display:inline-block;}
  .result-block ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7;}
  .result-block p{font-size:13.5px;line-height:1.7;margin:4px 0;}
  .result-block h4{font-family:'Inter',sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);margin:14px 0 6px;}
  .qw-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;font-size:13px;line-height:1.65;}
  .qw-card b{color:var(--navy);}
  table.cost{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  table.cost th{background:var(--navy);color:#fff;font-weight:600;text-align:left;padding:9px 12px;font-size:12px;}
  table.cost td{padding:9px 12px;border-top:1px solid var(--line);}
  table.cost tr:last-child td{font-weight:700;color:var(--navy);}
  .roadmap-item{border-left:2px solid var(--gold-soft);padding:2px 0 14px 16px;margin-left:4px;}
  .roadmap-item .timeline{font-size:11px;color:var(--gold);letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px;}
  .roadmap-item .phase{font-weight:700;font-size:13.5px;color:var(--navy);}
  .roadmap-item p{font-size:13px;color:var(--slate);margin:3px 0 0;line-height:1.6;}

  .ai-cta{background:linear-gradient(135deg,var(--navy),var(--navy-3));border-radius:14px;padding:34px 26px;text-align:center;color:#fff;}
  .ai-cta h2{color:#fff;font-size:23px;margin:10px 0;}
  .ai-cta p{color:#b7c0cd;font-size:13.5px;max-width:460px;margin:0 auto 20px;line-height:1.7;}
  .ai-cta button{background:var(--gold);color:var(--navy);border:none;font-family:'Inter',sans-serif;font-weight:700;font-size:14px;padding:14px 28px;border-radius:9px;cursor:pointer;}
  .ai-cta button:disabled{opacity:.6;cursor:wait;}
  .loading-dots span{animation:blink 1.2s infinite;}
  .loading-dots span:nth-child(2){animation-delay:.2s;}
  .loading-dots span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}
  .print-btn{margin:20px 0 0;display:none;}

  @media(max-width:680px){
    .route-dot{width:auto;font-size:0;}
    .route-dot .pip{margin-bottom:0;}
    .cover h1{font-size:27px;}
    .score-grid{grid-template-columns:1fr;}
    .matrix-scales{gap:10px;flex-direction:column;align-items:flex-start;}
  }
  @media print{
    header.app-header,.navbar,.ai-cta,.print-btn{display:none !important;}
    body{background:#fff;}
    main{padding:0;max-width:100%;}
    .panel{display:none;}
    .panel[data-panel="15"]{display:block !important;}
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="brandrow">
    <div class="brand">Linkd <span>by Royal</span></div>
    <div class="sub">Discovery &amp; Strategy Intake</div>
  </div>
  <div class="route-wrap">
    <div class="route-track">
      <div class="route-line"><div class="route-line-fill" id="routeFill"></div></div>
      <div class="route-boat" id="routeBoat">⛴</div>
      <div class="route-dots" id="routeDots"></div>
    </div>
  </div>
  <div class="progress-row">
    <button id="resetBtn" type="button">Opnieuw beginnen</button>
    <span id="progressPct">0% voltooid</span>
  </div>
</header>

<main id="main"></main>

<div class="navbar">
  <div class="inner">
    <button class="btn btn-ghost" id="prevBtn">Vorige</button>
    <span class="savestate" id="saveState"></span>
    <button class="btn btn-primary" id="nextBtn">Volgende</button>
  </div>
</div>

<script>
/* ============ SECTION DEFINITIONS ============ */
const SECTIONS = [
  {label:'Start'},{label:'Bedrijf'},{label:'Strategie'},{label:'Diensten'},{label:'Doelgroep'},
  {label:'Team'},{label:'Financiën'},{label:'Processen'},{label:'Regelgeving'},{label:'Concurrentie'},
  {label:'Branding'},{label:'Website'},{label:'AI'},{label:'Prioriteiten'},{label:'Verwachtingen'},{label:'Analyse'}
];
const STORAGE_KEY = 'lbr_intake_v2';
let current = 0;
let answers = {};

/* ============ MARKUP ============ */
const cg = (key, opts, other) => `
  <div class="choice-grid" data-checkgroup="${key}">
    ${opts.map(o=>`<label class="choice"><input type="checkbox" value="${o}">${o}</label>`).join('')}
  </div>
  ${other ? `<input style="margin-top:12px" type="text" placeholder="${other}" data-key="${key}_anders">` : ''}`;

const yn = (key,label) => `
  <div class="yn-row" data-ynrow="${key}">
    <span class="yn-label">${label}</span>
    <div class="switch"><button type="button" data-val="nee">Nee</button><button type="button" data-val="ja">Ja</button></div>
  </div>`;

const ta = (key,label,ph='') => `
  <div class="field-group"><label class="field-label">${label}</label><textarea data-key="${key}" placeholder="${ph}"></textarea></div>`;

const tx = (key,label,ph='',type='text') => `
  <div class="field-group"><label class="field-label">${label}</label><input type="${type}" data-key="${key}" placeholder="${ph}"></div>`;

const sel = (key,label,opts) => `
  <div class="field-group"><label class="field-label">${label}</label>
  <select data-key="${key}"><option value="">Kies…</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select></div>`;

document.getElementById('main').innerHTML = `

<section class="panel active" data-panel="0">
  <div class="cover">
    <div class="eyebrow">Consultancytraject</div>
    <h1>Discovery &amp; Strategy Intake</h1>
    <p>Deze intake vormt de basis van uw strategie, merkidentiteit, website, CRM en AI-automatisering. Hoe vollediger de antwoorden, hoe scherper de analyse en het advies van Linkd by Royal.</p>
    <div class="meta">
      <div><b>14</b>secties</div>
      <div><b>±35</b>minuten</div>
      <div><b>1</b>AI-strategieanalyse</div>
    </div>
    <p class="note">Uw antwoorden worden automatisch lokaal opgeslagen. U kunt dit venster sluiten en later verdergaan waar u gebleven was.</p>
  </div>
</section>

<section class="panel" data-panel="1">
  <div class="eyebrow">Sectie 1 / 14</div>
  <h2>Bedrijfsprofiel</h2>
  <p class="intro-text">Vertel ons wie u bent en waarom deze route, van Curaçao naar Venezuela met Colombia als volgende stap, voor u de juiste is.</p>
  ${tx('bedrijfsnaam','Bedrijfsnaam')}
  ${sel('stadium','Huidig stadium',['Startup / pre-launch','0-2 jaar operationeel','2-5 jaar operationeel','5+ jaar operationeel'])}
  ${sel('werknemers','Aantal werknemers',['1 (solo)','2-5','6-15','16-50','50+'])}
  ${ta('bedrijf_intro','Korte omschrijving van uw bedrijf','Wie zijn jullie, wat doen jullie vandaag?')}
  ${ta('missie','Wat is uw missie?')}
  ${ta('visie','Wat is uw visie voor de komende 5 jaar?')}
  ${ta('waarom_venezuela','Waarom wilt u starten met reizen naar Venezuela?')}
  ${ta('waarom_colombia','Waarom staat Colombia als volgende stap op de planning?')}
  ${ta('onderscheidend','Wat maakt u anders dan bestaande reisorganisaties?')}
  ${tx('startdatum','Beoogde startdatum eerste reizen','', 'date')}
</section>

<section class="panel" data-panel="2">
  <div class="eyebrow">Sectie 2 / 14</div>
  <h2>Strategie &amp; Doelstellingen</h2>
  <p class="intro-text">Wat moet dit project concreet opleveren?</p>
  <div class="field-group">
    <label class="field-label">Wat wilt u met dit project bereiken?</label>
    ${cg('doelstellingen',['Meer boekingen','Professionele uitstraling','Volledig online boekingsproces','Minder handmatig werk','Meer automatisering','Hogere klanttevredenheid','Internationale uitbreiding'],'Andere doelstelling…')}
  </div>
  <div class="field-group">
    <label class="field-label">Hoe ambitieus is de gewenste groei de komende 12 maanden? (1 = rustig, 10 = maximaal)</label>
    <div class="rating-scale" data-rating="ambitie_score" data-max="10"></div>
  </div>
  ${ta('visie_1jaar','Waar ziet u uzelf over één jaar?')}
</section>

<section class="panel" data-panel="3">
  <div class="eyebrow">Sectie 3 / 14</div>
  <h2>Diensten &amp; Aanbod</h2>
  <p class="intro-text">Welke diensten wilt u (op termijn) aanbieden?</p>
  ${cg('diensten',['Ferry','Vluchten','Hotels','Excursies','Transfers','Autoverhuur','Reisverzekering','Visa assistance','Medical Tourism','Business Travel','VIP Travel','Groepsreizen','Maatwerkreizen'],'Andere dienst…')}
  <div style="margin-top:24px;">${ta('usp','Wat is uw unieke propositie? Waarom zou een klant bij u boeken?')}</div>
</section>

<section class="panel" data-panel="4">
  <div class="eyebrow">Sectie 4 / 14</div>
  <h2>Doelgroep &amp; Markten</h2>
  <div class="field-group">
    <label class="field-label">Herkomstmarkten</label>
    ${cg('doelgroep_markt',['Curaçao','Nederland','Venezuela','Colombia'])}
  </div>
  <div class="field-group">
    <label class="field-label">Klantsegmenten</label>
    ${cg('doelgroep_segment',['Zakelijke klanten','Families','Studenten','Toeristen','Expats'])}
  </div>
  ${ta('ideale_klant','Beschrijf uw ideale klant')}
</section>

<section class="panel" data-panel="5">
  <div class="eyebrow">Sectie 5 / 14</div>
  <h2>Organisatie &amp; Team</h2>
  <p class="intro-text">Wie voert dit uit en wie beslist?</p>
  ${ta('besluitvormers','Wie zijn de besluitvormers in dit traject?','Namen en rollen')}
  ${sel('it_niveau','Digitale en IT-vaardigheden binnen het team',['Beperkt','Basis','Gemiddeld','Sterk'])}
  ${tx('implementatie_eigenaar','Wie wordt intern verantwoordelijk voor de implementatie?')}
  ${ta('team_beschikbaarheid','Hoeveel tijd kan het team per week vrijmaken voor dit traject?')}
</section>

<section class="panel" data-panel="6">
  <div class="eyebrow">Sectie 6 / 14</div>
  <h2>Financiële Context</h2>
  <p class="intro-text">Een realistisch budgetbeeld maakt de roadmap en kostenraming betrouwbaar.</p>
  ${sel('omzet','Jaarlijkse omzet (schatting)',['Nog geen omzet','Onder €50k','€50k-€250k','€250k-€1M','€1M-€5M','€5M+'])}
  ${sel('budget','Beschikbaar budget voor dit traject (12 maanden)',['Onder €10k','€10k-€25k','€25k-€50k','€50k-€100k','€100k+','Nog onbekend'])}
  ${ta('financiering','Zijn er financieringsmogelijkheden (investeerders, lening, subsidies)?')}
  ${ta('budget_beperkingen','Zijn er budgetbeperkingen of voorwaarden waar we rekening mee moeten houden?')}
</section>

<section class="panel" data-panel="7">
  <div class="eyebrow">Sectie 7 / 14</div>
  <h2>Huidige Situatie &amp; Processen</h2>
  <div class="yn-toggle-list">
    ${yn('website','Website')}
    <div class="followup" data-followup-for="website">
      <label class="field-label">URL van de huidige website</label>
      <input type="url" data-key="website_url" placeholder="https://">
    </div>
    ${yn('crm','CRM')}
    <div class="followup" data-followup-for="crm">
      <label class="field-label">Welk CRM, en hoe tevreden bent u erover?</label>
      <input type="text" data-key="crm_naam">
    </div>
    ${yn('whatsapp','WhatsApp Business')}
    ${yn('betalingen','Online betalingen')}
    <div class="followup" data-followup-for="betalingen">
      <label class="field-label">Welke betaalprovider(s)?</label>
      <input type="text" data-key="betalingen_provider" placeholder="bijv. banktransfer, kaart, lokale provider">
    </div>
    ${yn('boekingssysteem','Boekingssysteem')}
    <div class="followup" data-followup-for="boekingssysteem">
      <label class="field-label">Welk systeem?</label>
      <input type="text" data-key="boekingssysteem_naam">
    </div>
    ${yn('leveranciers','Vaste leveranciers (ferry, hotels, transfers)')}
    ${yn('contracten','Bestaande contracten')}
    <div class="followup" data-followup-for="contracten">
      <label class="field-label">Upload relevante contracten (optioneel)</label>
      <div class="upload-box">Blader naar bestanden<br><input type="file" data-key="contracten_bestand" multiple style="margin-top:8px;"></div>
    </div>
  </div>
  <div style="margin-top:24px;">
    ${ta('proces_huidig','Beschrijf stap voor stap hoe een klant nu een reis boekt')}
    ${ta('proces_knelpunten','Waar loopt u nu tegenaan?')}
    ${ta('proces_tijdrovend','Welke processen kosten de meeste tijd?')}
  </div>
</section>

<section class="panel" data-panel="8">
  <div class="eyebrow">Sectie 8 / 14</div>
  <h2>Regelgeving &amp; Compliance</h2>

/* labeled checkgroup helper used above via template literal, define before innerHTML would be cleaner;
   declared here as function hoisting handles it */
function cgLabeled(key,label,opts){
  return `<div class="field-group"><label class="field-label">${label}</label>${cg(key,opts)}</div>`;
}

/* ============ ROUTE / PROGRESS ============ */
const routeDotsEl = document.getElementById('routeDots');
SECTIONS.forEach((s,i)=>{
  if(i===0 || i===15) return;
  const d = document.createElement('div');
  d.className='route-dot'; d.dataset.i=i;
  d.innerHTML = `<div class="pip"></div><div>${s.label}</div>`;
  d.addEventListener('click',()=>showPanel(i));
  routeDotsEl.appendChild(d);
});

function updateRoute(){
  const clamped = Math.max(1, Math.min(current, 14));
  document.querySelectorAll('.route-dot').forEach(d=>{
    const di=parseInt(d.dataset.i);
    d.classList.toggle('done', di<clamped || current===15);
    d.classList.toggle('current', di===clamped && current>0 && current<15);
  });
  let pct = current===0?0 : current===15?100 : Math.round((clamped/14)*100);
  document.getElementById('routeFill').style.width=pct+'%';
  document.getElementById('progressPct').textContent=pct+'% voltooid';
  document.getElementById('routeBoat').style.left=`calc(12px + ${pct} * (100% - 24px) / 100)`;
}

function showPanel(i){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelector(`.panel[data-panel="${i}"]`).classList.add('active');
  current=i;
  persist();
  updateRoute();
  document.getElementById('prevBtn').disabled=(i===0);
  document.getElementById('nextBtn').style.display=(i===15)?'none':'inline-block';
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('nextBtn').addEventListener('click',()=>{ if(current<15) showPanel(current+1); });
document.getElementById('prevBtn').addEventListener('click',()=>{ if(current>0) showPanel(current-1); });

/* ============ PERSISTENCE ============ */
let saveTimer=null;
function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({current, answers}));
    const el=document.getElementById('saveState');
    el.textContent='Opgeslagen';
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{el.textContent='';},1500);
  }catch(e){}
}
document.getElementById('resetBtn').addEventListener('click',()=>{
  if(confirm('Alle antwoorden wissen en opnieuw beginnen?')){
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
});

/* ============ FIELD BINDINGS ============ */
document.querySelectorAll('[data-key]').forEach(el=>{
  el.addEventListener('input',()=>{
    answers[el.dataset.key] = (el.type==='file')
      ? Array.from(el.files).map(f=>f.name)
      : el.value;
    persist();
  });
});

document.querySelectorAll('[data-checkgroup]').forEach(group=>{
  const key=group.dataset.checkgroup;
  if(!answers[key]) answers[key]=[];
  group.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change',()=>{
      cb.closest('.choice').classList.toggle('checked',cb.checked);
      answers[key]=Array.from(group.querySelectorAll('input:checked')).map(c=>c.value);
      syncCheckFollowups(key);
      persist();
    });
  });
});
function syncCheckFollowups(key){
  document.querySelectorAll(`[data-followup-for-check^="${key}:"]`).forEach(fu=>{
    const wanted=fu.dataset.followupForCheck.split(':')[1];
    fu.classList.toggle('show',(answers[key]||[]).includes(wanted));
  });
}

document.querySelectorAll('[data-ynrow]').forEach(row=>{
  const key=row.dataset.ynrow;
  row.querySelectorAll('.switch button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      setYN(key,btn.dataset.val);
      persist();
    });
  });
});
function setYN(key,val){
  const row=document.querySelector(`[data-ynrow="${key}"]`);
  if(!row) return;
  answers[key]=val;
  row.querySelectorAll('.switch button').forEach(b=>{
    b.classList.toggle('on', b.dataset.val===val);
    b.classList.toggle('yes', b.dataset.val===val && val==='ja');
  });
  const fu=document.querySelector(`[data-followup-for="${key}"]`);
  if(fu) fu.classList.toggle('show', val==='ja');
}

function buildScale(container,key,max){
  for(let n=1;n<=max;n++){
    const b=document.createElement('button');
    b.type='button'; b.textContent=n;
    b.addEventListener('click',()=>{ setScale(container,key,n); persist(); });
    container.appendChild(b);
  }
}
function setScale(container,key,n){
  answers[key]=n;
  Array.from(container.querySelectorAll('button')).forEach((b,i)=>b.classList.toggle('on', i+1===n));
}
document.querySelectorAll('[data-rating]').forEach(c=>buildScale(c,c.dataset.rating,parseInt(c.dataset.max||'10')));

/* ============ RESTORE SAVED SESSION ============ */
(function restore(){
  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem(STORAGE_KEY)); }catch(e){}
  if(!saved){ updateRoute(); showPanel(0); return; }
  answers=saved.answers||{};
  Object.entries(answers).forEach(([key,val])=>{
    const el=document.querySelector(`[data-key="${key}"]`);
    if(el && el.type!=='file' && typeof val==='string'){ el.value=val; return; }
    const group=document.querySelector(`[data-checkgroup="${key}"]`);
    if(group && Array.isArray(val)){
      group.querySelectorAll('input[type=checkbox]').forEach(cb=>{
        cb.checked=val.includes(cb.value);
        cb.closest('.choice').classList.toggle('checked',cb.checked);
      });
      syncCheckFollowups(key);
      return;
    }
    if(document.querySelector(`[data-ynrow="${key}"]`)){ setYN(key,val); return; }
    const scale=document.querySelector(`[data-rating="${key}"]`) || document.getElementById(key+'_scale');
    if(typeof val==='number'){
      const c=document.querySelector(`[data-rating="${key}"]`) || document.getElementById(key.replace(/_(impact|effort)$/, '_$1_scale'));
      if(c) setScale(c,key,val);
    }
  });
  showPanel(Math.min(saved.current||0,15));
})();

/* ============ AI ANALYSIS ============ */
document.getElementById('generateBtn').addEventListener('click', async ()=>{
  const btn=document.getElementById('generateBtn');
  btn.disabled=true;
  btn.innerHTML='Analyseren<span class="loading-dots">.<span>.</span><span>.</span></span>';

  const lines=Object.entries(answers)
    .filter(([k,v])=>v!==''&&v!==null&&v!==undefined&&(Array.isArray(v)?v.length:true))
    .map(([k,v])=>`${k}: ${Array.isArray(v)?v.join(', '):v}`).join('\n');

  const systemPrompt=`Je bent een senior strategisch consultant met 15+ jaar ervaring in bedrijfsanalyse, digitale transformatie en operationele optimalisatie voor mkb-bedrijven, werkend namens consultancybureau Linkd by Royal. Je analyseert een Discovery Intake van een nieuwe reisonderneming (Curaçao naar Venezuela, later Colombia).

Wees kritisch maar constructief, wees voorzichtig met aannames en maak ze expliciet, geef realistische tijdlijnen en marktconforme bedragen in euro's, en focus eerst op high-impact low-effort acties. Gebruik de prioriteitsmatrix-antwoorden (per onderdeel prio_*_impact en prio_*_effort, schaal 1-5) om quick wins te identificeren.

Bereken drie scores op schaal 0-100 en vergelijk met een realistisch branchegemiddelde voor kleine reisorganisaties:
- digitalMaturity: gebaseerd op aanwezigheid van website, CRM, online boeken/betalen, boekingssysteem en team-IT-niveau
- aiReadiness: gebaseerd op AI-ervaring, team-comfort, budget en helderheid van use-cases
- risk: gebaseerd op regelgeving, vergunningen, budget, teamcapaciteit en marktrisico (hoger = meer risico)

Antwoord UITSLUITEND met geldige JSON, zonder markdown-codeblokken en zonder tekst ervoor of erna, exact in dit formaat:
{
 "samenvatting":"3-5 zinnen managementsamenvatting incl. waarom nu actie nodig is",
 "knelpunten":{"operationeel":["..."],"digitaal":["..."],"regelgeving":["..."]},
 "kansen":{"groei":["..."],"automatisering":["..."]},
 "quickWins":[{"actie":"...","waarom":"...","kosten":"€...","impact":"...","tijdlijn":"..."}],
 "kostenraming":[{"onderdeel":"...","laag":"€...","gemiddeld":"€...","hoog":"€..."}],
 "kostenramingTotaal":{"laag":"€...","gemiddeld":"€...","hoog":"€..."},
 "roadmap":[{"fase":"...","tijdlijn":"Maanden X-Y","budget":"€...","acties":"...","resultaten":"..."}],
 "scores":{"digitalMaturity":{"score":0,"benchmark":0,"interpretatie":"...","doel12mnd":0},"aiReadiness":{"score":0,"benchmark":0,"interpretatie":"...","doel12mnd":0},"risk":{"score":0,"benchmark":0,"interpretatie":"...","mitigatie":"..."}},
 "gespreksleidraad":{"Strategie & Visie":["..."],"Operatie & Processen":["..."],"Financiën & Budget":["..."],"Risico's & Compliance":["..."]}
}
Schrijf alles in het Nederlands, zakelijk en concreet. 2-4 items per lijst, 3-4 quick wins, 4 roadmap-fasen, 2-3 vragen per gespreksleidraad-thema.`;

  try{
    // Gehost op de backend (http/https): analyse via de server, key blijft geheim.
    // Los geopend als bestand: directe call als fallback.
    const BACKEND_URL=''; // leeg = zelfde server; of vul volledige URL in bij losse hosting
    const useBackend=location.protocol.startsWith('http');
    let parsed;
    if(useBackend){
      const response=await fetch((BACKEND_URL||'')+'/api/analyze',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({intakeText:`Intake-antwoorden:\n${lines||'(geen antwoorden ingevuld)'}`,systemPrompt})
      });
      if(!response.ok) throw new Error('Backend '+response.status);
      parsed=await response.json();
    }else{
      const response=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:4000,
          system:systemPrompt,
          messages:[{role:"user",content:`Intake-antwoorden:\n${lines||'(geen antwoorden ingevuld)'}`}]
        })
      });
      const data=await response.json();
      let text=data.content.map(b=>b.text||'').join('\n');
      const match=text.match(/\{[\s\S]*\}/);
      if(!match) throw new Error('Geen JSON in antwoord');
      parsed=JSON.parse(match[0]);
    }
    renderResults(parsed);
    if(useBackend){
      // Dossier + automatische mails: fouten hier mogen de klant niet storen
      fetch((BACKEND_URL||'')+'/api/submit',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({answers,analysis:parsed})
      }).catch(()=>{});
    }
  }catch(err){
    console.error('AI-analyse mislukt:',err);
    btn.disabled=false;
    btn.textContent='Probeer opnieuw';
    const el=document.getElementById('aiResults');
    el.style.display='block';
    el.innerHTML=`<div class="result-block"><h3>Analyse tijdelijk niet beschikbaar</h3><p>De analyse kon niet worden opgesteld. Uw antwoorden zijn lokaal bewaard, probeer het over een moment opnieuw.</p></div>`;
  }
});

function renderResults(r){
  document.getElementById('aiCtaBlock').style.display='none';
  const el=document.getElementById('aiResults');
  el.style.display='block';
  document.getElementById('printBtn').style.display='inline-block';

  const list=arr=>`<ul>${(arr||[]).map(x=>`<li>${x}</li>`).join('')}</ul>`;
  const catBlock=(obj)=>Object.entries(obj||{}).map(([k,v])=>`<h4>${k}</h4>${list(v)}`).join('');
  const scoreCard=(lbl,s,extra)=>`
    <div class="score-card">
      <div class="num">${s?.score ?? '–'}<small>/100</small></div>
      <div class="lbl">${lbl}</div>
      <div class="bench">Branche: ${s?.benchmark ?? '–'} · ${extra==='doel'?('Doel 12 mnd: '+(s?.doel12mnd ?? '–')):''}${extra==='mitigatie'?'':''}</div>
    </div>`;

  el.innerHTML=`
    <div class="result-block"><h3>Managementsamenvatting</h3><p>${r.samenvatting||''}</p></div>
    <div class="score-grid">
      ${scoreCard('Digital Maturity',r.scores?.digitalMaturity,'doel')}
      ${scoreCard('AI Readiness',r.scores?.aiReadiness,'doel')}
      ${scoreCard('Risicoscore',r.scores?.risk,'mitigatie')}
    </div>
    <div class="result-block"><h3>Score-interpretatie</h3>
      <p><b>Digital Maturity:</b> ${r.scores?.digitalMaturity?.interpretatie||''}</p>
      <p><b>AI Readiness:</b> ${r.scores?.aiReadiness?.interpretatie||''}</p>
      <p><b>Risico:</b> ${r.scores?.risk?.interpretatie||''} ${r.scores?.risk?.mitigatie?('<br><b>Mitigatie:</b> '+r.scores.risk.mitigatie):''}</p>
    </div>
    <div class="result-block"><h3>Knelpunten</h3>${catBlock(r.knelpunten)}</div>
    <div class="result-block"><h3>Kansen</h3>${catBlock(r.kansen)}</div>
    <div class="result-block"><h3>Quick wins</h3>
      ${(r.quickWins||[]).map(q=>`<div class="qw-card"><b>${q.actie}</b><br>${q.waarom}<br><b>Kosten:</b> ${q.kosten} · <b>Impact:</b> ${q.impact} · <b>Tijdlijn:</b> ${q.tijdlijn}</div>`).join('')}
    </div>
    <div class="result-block"><h3>Kostenraming (indicatief, 12 maanden)</h3>
      <table class="cost">
        <tr><th>Onderdeel</th><th>Laag</th><th>Gemiddeld</th><th>Hoog</th></tr>
        ${(r.kostenraming||[]).map(c=>`<tr><td>${c.onderdeel}</td><td>${c.laag}</td><td>${c.gemiddeld}</td><td>${c.hoog}</td></tr>`).join('')}
        ${r.kostenramingTotaal?`<tr><td>Totaal</td><td>${r.kostenramingTotaal.laag}</td><td>${r.kostenramingTotaal.gemiddeld}</td><td>${r.kostenramingTotaal.hoog}</td></tr>`:''}
      </table>
      <p class="field-hint" style="margin-top:8px;">Ramingen zijn indicatief en worden na het strategiegesprek verfijnd in de projectplanning.</p>
    </div>
    <div class="result-block"><h3>Implementatie-roadmap</h3>
      ${(r.roadmap||[]).map(p=>`<div class="roadmap-item"><div class="timeline">${p.tijdlijn||''} · ${p.budget||''}</div><div class="phase">${p.fase||''}</div><p>${p.acties||''}</p><p><b>Resultaten:</b> ${p.resultaten||''}</p></div>`).join('')}
    </div>
    <div class="result-block"><h3>Gespreksleidraad strategiegesprek</h3>${catBlock(r.gespreksleidraad)}</div>
  `;
}
</script>
